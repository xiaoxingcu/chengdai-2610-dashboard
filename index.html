function wDisp(w) { return w <= 1.5 ? Math.round(w * 100) : Math.round(w); }
function fmtWan(v) { if (v == null || isNaN(v)) return '--'; const w = v / 10000; return (v >= 0 ? '+' : '') + w.toFixed(2) + '万'; }
function fmtWanAbs(v) { if (v == null || isNaN(v)) return '--'; return (v / 10000).toFixed(2) + '万'; }
function snapItem(label, value, cls) {
  return '<div class="sim-snap-item"><div class="ss-label">' + label + '</div><div class="ss-value ' + (cls || '') + '">' + value + '</div></div>';
}
function reasonRow(name, val, why) {
  return '<div class="reason-row"><span class="rs-name">' + name + '</span><span class="rs-val">' + val + '</span><span class="rs-why">' + why + '</span></div>';
}

    '<div class="sim-result-grid">' +
    '<div class="sim-result-item"><div class="sr-label">业务结果得分</div><div class="sr-value" id="simBiz">--</div><div class="sr-delta" id="simBizDelta"></div></div>' +
    '<div class="sim-result-item"><div class="sr-label">估算组内排名</div><div class="sr-value" id="simRank">--</div><div class="sr-sub" id="simBandLbl"></div></div>' +
    '<div class="sim-result-item"><div class="sr-label">预估最终激励</div><div class="sr-value" id="simMoney">--</div><div class="sr-delta" id="simMoneyDelta"></div></div>' +
    '<div class="sim-result-item"><div class="sr-label">餐饮点位</div><div class="sr-value" id="simCatPt" style="font-size:16px">--</div><div class="sr-sub" id="simCatAmt"></div></div>' +
    '<div class="sim-result-item"><div class="sr-label">零售点位</div><div class="sr-value" id="simRetPt" style="font-size:16px">--</div><div class="sr-sub" id="simRetAmt"></div></div>' +
    '</div><div class="sim-breakdown" id="simBreakdown"></div><div class="sim-verdict" id="simVerdict"></div></div>';

  el.innerHTML = '<div style="font-size:14px;font-weight:600;color:#333;margin-bottom:14px">' + currentCity + ' · 城市测算</div>' + snap + form + ctx + result;
  calcSim();
}

function onSimChange() {
  const sim = SIM[currentCity]; if (!sim) return;
  sim.items.forEach(function(it) {
    const s = document.getElementById('slider_' + it.key), i = document.getElementById('input_' + it.key);
    if (s && i) i.value = s.value;
  });
  calcSim();
}
function onSimInput(key) {
  const sim = SIM[currentCity]; if (!sim) return;
  const it = sim.items.filter(function(x) { return x.key === key; })[0];
  const i = document.getElementById('input_' + key), s = document.getElementById('slider_' + key);
  if (i && s && it) s.value = Math.min(it.max, Math.max(0, parseFloat(i.value) || 0));
  calcSim();
}

function calcSim() {
  const sim = SIM[currentCity]; if (!sim) return;
  const gv = function(k) { const e = document.getElementById('input_' + k); return e ? (parseFloat(e.value) || 0) : 0; };
  let num = 0, W = 0;
  sim.items.forEach(function(it) {
    const v = Math.min(it.max, Math.max(0, gv(it.key)));
    num += v * it.wt; W += it.wt;
  });
  const simBiz = W > 0 ? num / W : 0;
  const dBiz = simBiz - sim.curBiz;

  const sens = parseFloat((document.getElementById('simSens') || {}).value) || 1.5;
  const pct = Math.max(0, Math.min(100, sim.curRank - sens * dBiz));
  const band = BANDS.filter(function(b) { return pct < b.max; })[0] || BANDS[BANDS.length - 1] || { label: '--', cp: 0, rp: 0, cn: 0, rn: 0, src: '' };

  let cat = 0, ret = 0, lines = [];
  if (band.cp > 0) {
    const pc = sim.price < 1 ? sim.price : 1;
    cat = sim.baseCater * band.cp / 100 * pc * sim.execC;
    lines.push('餐饮 = 全月基数 ' + fmtWanAbs(sim.baseCater) + ' × 正点位 ' + band.cp + '%' +
      (pc < 1 ? ' × 价格力折扣 ' + pc : '') + (sim.execC < 1 ? ' × 过程执行系数 ' + sim.execC : '') + ' = ' + fmtWan(cat));
  } else if (band.cn > 0) {
    cat = -sim.baseCater * band.cn / 100 * (1 - (sim.exemptC || 0));
    lines.push('餐饮 = 全月基数 ' + fmtWanAbs(sim.baseCater) + ' × 罚点位 ' + band.cn + '%' +
      ((sim.exemptC || 0) > 0 ? ' × (1-豁免' + Math.round(sim.exemptC * 100) + '%)' : '') + ' = ' + fmtWan(cat));
  }
  if (band.rp > 0) {
    ret = sim.baseRetail * band.rp / 100 * sim.execR;
    lines.push('零售 = 全月基数 ' + fmtWanAbs(sim.baseRetail) + ' × 正点位 ' + band.rp + '%' +
      (sim.execR < 1 ? ' × 过程执行系数 ' + sim.execR : '') + ' = ' + fmtWan(ret));
  } else if (band.rn > 0) {
    ret = -sim.baseRetail * band.rn / 100 * (1 - (sim.exemptR || 0));
    lines.push('零售 = 全月基数 ' + fmtWanAbs(sim.baseRetail) + ' × 罚点位 ' + band.rn + '%' +
      ((sim.exemptR || 0) > 0 ? ' × (1-豁免' + Math.round(sim.exemptR * 100) + '%)' : '') + ' = ' + fmtWan(ret));
  }
  const total = cat + ret;

  const set = function(id, txt) { const e = document.getElementById(id); if (e) e.textContent = txt; };
  set('simBiz', simBiz.toFixed(2));
  set('simRank', pct.toFixed(1) + '%');
  set('simBandLbl', band.label + (band.src ? ' · ' + band.src : ''));
  set('simMoney', total === 0 ? '0.00万' : fmtWan(total));
  set('simCatPt', band.cp > 0 ? '+' + band.cp + '%' : band.cn > 0 ? '-' + band.cn + '%' : '0%');
  set('simRetPt', band.rp > 0 ? '+' + band.rp + '%' : band.rn > 0 ? '-' + band.rn + '%' : '0%');
  set('simCatAmt', cat ? fmtWan(cat) : '');
  set('simRetAmt', ret ? fmtWan(ret) : '');

  const dEl = document.getElementById('simBizDelta');
  if (dEl) { dEl.textContent = (dBiz >= 0 ? '+' : '') + dBiz.toFixed(2); dEl.className = 'sr-delta ' + (dBiz > 0.01 ? 'up' : dBiz < -0.01 ? 'down' : ''); }
  const mEl = document.getElementById('simMoneyDelta');
  const dMoney = total - sim.curInc;
  if (mEl) { mEl.textContent = '较当前 ' + (dMoney === 0 ? '0.00万' : fmtWan(dMoney)); mEl.className = 'sr-delta ' + (dMoney > 1 ? 'up' : dMoney < -1 ? 'down' : ''); }

  set('simBreakdown', lines.length ? lines.join('<br>') : '当前档位无正/负激励点位，餐饮与零售金额均为 0。');

  const vd = document.getElementById('simVerdict');
  if (vd) {
    if (total > 0) vd.className = 'sim-verdict pos';
    else if (total < 0) vd.className = 'sim-verdict neg';
    else vd.className = 'sim-verdict';
    let tag, txt;
    if (total > 0) { tag = '预计参激励'; txt = '排名落在 <b>' + band.label + '</b>，按当前基数预估全月最终激励 <b>' + fmtWan(total) + '</b>'; }
    else if (total < 0) { tag = '预计负激励'; txt = '排名落在 <b>' + band.label + '</b>，按当前基数预估全月最终激励 <b>' + fmtWan(total) + '</b>；把得分拉回 40-80% 中部档即可归零'; }
    else { tag = '零激励'; txt = '排名估算落在 <b>' + band.label + '</b>：' + (band.src || '该区间无正/负激励点位。'); }
    vd.innerHTML = '<span class="vd-tag">' + tag + '</span>' + txt;
  }
}

function fmtPct(v) { return (v*100).toFixed(1) + '%'; }
function statusColor(s) { return s === '正激励' ? '#16a34a' : s === '负激励' ? '#dc2626' : '#6b7280'; }

function renderStatsCards() {
  const s = summary;
  const el = document.getElementById('statsCards');
  const netCol = s.net >= 0 ? '#16a34a' : '#dc2626';
  el.innerHTML =
    '<div class="stat-card net-total"><div class="sc-label">整商净激励金额</div>' +
      '<div class="sc-value" style="color:' + netCol + '">' + (s.net >= 0 ? '+' : '') + s.net.toLocaleString() + '元</div>' +
      '<div class="sc-detail">奖励 ' + s.totalPos.toLocaleString() + '元 + 罚款 ' + s.totalNeg.toLocaleString() + '元</div></div>' +
    '<div class="stat-card" style="border-left-color:#16a34a"><div class="sc-label">正激励城市（' + s.pos.length + '）</div>' +
      '<div class="sc-value" style="color:#16a34a">' + (s.pos.length ? '+' + s.totalPos.toLocaleString() : '0') + '元</div>' +
      '<div class="sc-detail">' + (s.pos.map(function(c){return c.name + ' +' + c.amount.toLocaleString();}).join('<br>') || '无') + '</div></div>' +
    '<div class="stat-card" style="border-left-color:#dc2626"><div class="sc-label">负激励城市（' + s.neg.length + '）</div>' +
      '<div class="sc-value" style="color:#dc2626">' + (s.neg.length ? s.totalNeg.toLocaleString() : '0') + '元</div>' +
      '<div class="sc-detail">' + (s.neg.map(function(c){return c.name + ' ' + c.amount.toLocaleString();}).join('<br>') || '无') + '</div></div>' +
    '<div class="stat-card" style="border-left-color:#f59e0b"><div class="sc-label">有警告城市（' + s.warns.length + '）</div>' +
      '<div class="sc-value" style="color:#f59e0b">' + s.warns.length + '个</div>' +
      '<div class="sc-detail">' + (s.warns.map(function(w){return w.name + '：' + w.warns.join('、');}).join('<br>') || '无') + '</div></div>' +
    '<div class="stat-card" style="border-left-color:#6b7280"><div class="sc-label">零激励城市（' + s.zero.length + '）</div>' +
      '<div class="sc-value" style="color:#6b7280">' + s.zero.length + '个</div>' +
      '<div class="sc-detail">' + (s.zero.join('、') || '无') + '</div></div>';
}

const SUM_COLS = [
  {key:'final_inc', label:'激励金额', mode:'money'},
  {key:'biz_result_score', label:'业务结果得分'},
  {key:'biz_result_rank', label:'业务结果排名', mode:'pct'},
  {key:'cater_proc_score', label:'餐饮过程'},
  {key:'retail_proc_score', label:'零售过程'},
  {key:'gn_rate', label:'餐饮净G率', mode:'pct'},
  {key:'order_rate', label:'餐饮订单率', mode:'pct'},
  {key:'retail_gn_rate', label:'零售净G率', mode:'pct'},
  {key:'comp_tt', label:'复合妥投率', mode:'pct2'},
  {key:'newuser_ot', label:'新客准时率', mode:'pct2'}
];

function renderCitySummaryTable() {
  const LI = dateLabels.length - 1;
  let html = '<div class="cst-wrap"><table class="cst-table"><thead><tr><th>城市</th><th>激励金额</th><th>警告</th>';
  SUM_COLS.forEach(function(c){ html += '<th>' + c.label + '</th>'; });
  html += '</tr></thead><tbody>';
  cities.forEach(function(city) {
    const d = formatted[city];
    if (!d) return;
    const a = analysis[city] || {};
    html += '<tr><td>' + city + '</td>';
    // 激励
    const incItem = d['final_inc'];
    if (incItem) {
      const raw = incItem.raw[LI];
      const bg = raw > 0 ? '#d1fae5' : raw < 0 ? '#fecaca' : '#fde68a';
      html += '<td style="background:' + bg + ';font-weight:700">' + incItem.values[LI] + '</td>';
    } else { html += '<td>--</td>'; }
    // 警告
    if (a.warns && a.warns.length) html += '<td><span class="cst-tag severe">' + a.warns.length + '项警告</span></td>';
    else html += '<td><span class="cst-tag ok" style="background:#16a34a">正常</span></td>';
    // 指标
    SUM_COLS.forEach(function(c) {
      const it = d[c.key];
      if (!it) { html += '<td>--</td>'; return; }
      let disp = it.values[LI];
      if (c.mode === 'pct' || c.mode === 'pct2') {
        const raw = it.raw[LI];
        disp = raw != null ? (raw*100).toFixed(c.mode === 'pct2' ? 2 : 1) + '%' : '--';
      }
      html += '<td style="background:' + it.colors[LI] + ';font-weight:600">' + disp + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('citySummaryTable').innerHTML = html;
}

function buildCityTable(city) {
  const d = formatted[city];
  if (!d) return '<div style="padding:12px;color:#999">无数据</div>';
  let html = '<div class="flat-section"><table class="metric-table"><thead><tr><th class="metric-name">指标</th>';
  dispIdx.forEach(function(i){ html += '<th>' + dateLabels[i] + '</th>'; });
  html += '</tr></thead><tbody>';
  rows.forEach(function(it) {
    const color = GRP[it.grp] || '#666';
    const pad = 8 + (it.lvl || 0) * 16;
    const bold = it.major ? 'font-weight:700;' : '';
    const chip = (it.gn && it.major) ? '<span class="grp-chip">' + it.gn + '</span>' : '';
    html += '<tr class="metric-row"><td class="metric-name" title="' + (it.path || it.label) + '" ' +
            'style="padding-left:' + pad + 'px;border-left:4px solid ' + color + ';' + bold + '">' + chip + it.label + '</td>';
    dispIdx.forEach(function(i) {
      const v = d[it.key] ? d[it.key].values[i] : '--';
      const c = d[it.key] ? d[it.key].colors[i] : '#fff';
      html += '<td class="metric-cell" style="background-color:' + c + ';' + (it.major ? 'font-weight:700' : '') + '">' + v + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderAllCities() {
  let html = '';
  cities.forEach(function(city) {
    const a = analysis[city] || {status:'零激励', inc:0};
    const sc = statusColor(a.status);
    html += '<div class="city-trend-block">';
    html += '<div class="city-trend-header" style="background:' + sc + '">' +
            '<span>' + city + ' <span style="font-weight:400;opacity:.85;font-size:12px">' +
            a.status + ' · 激励 ' + ((a.inc>=0?'+':'') + (a.inc||0).toLocaleString()) + '元</span>' +
            (a.warns && a.warns.length ? '<span class="cth-status" style="background:rgba(245,158,11,.9)">⚠ ' + a.warns.length + ' 项警告</span>' : '') +
            '</span><span style="font-size:12px;opacity:.85">日均基数 ' + ((a.base||0)/10000).toFixed(1) + '万</span></div>';
    html += '<div>' + buildCityTable(city) + '</div>';
    html += '</div>';
  });
  document.getElementById('allCitiesTrend').innerHTML = html;
}

function renderCityDetail() {
  // 城市下拉
  const sel = document.getElementById('citySelect');
  if (sel.options.length !== cities.length) {
    sel.innerHTML = cities.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
    sel.value = currentCity;
  }
  document.getElementById('citySectionTitle').textContent = '· ' + currentCity + (cityMode === 's' ? ' 城市测算' : ' 各板块明细');
  renderAnalysis();
  document.getElementById('metricTree').innerHTML = buildCityTable(currentCity);
  if (cityMode === 's') renderSimPanel();
}

function renderAnalysis() {
  const a = analysis[currentCity];
  const el = document.getElementById('analysisPanel');
  if (!a) { el.innerHTML = ''; return; }
  const sc = a.status === '正激励' ? 'pos' : a.status === '负激励' ? 'neg' : 'zero';
  const sugBg = a.status === '负激励' ? 'neg-bg' : '';

  let weakHtml = a.weak.length
    ? a.weak.map(function(w, i){ return '<div class="ap-item ' + (i===0?'highlight':'') + '">' + w.name + '：' + w.score + '分 · 权重' + w.weight + '% → 满权重可加综合 ' + w.potential + ' 分</div>'; }).join('')
    : '<div class="ap-item good">各板块得分均已 ≥100</div>';

  let behindHtml = a.behind.length
    ? a.behind.map(function(b){ return '<div class="ap-item trend">' + b.name + '：' + b.val + '%（<90%）</div>'; }).join('')
    : '<div class="ap-item good">关键完成率均 ≥90%</div>';

  let warnHtml = a.warns.length
    ? a.warns.map(function(w){ return '<div class="ap-item highlight">⚠️ ' + w + '</div>'; }).join('')
    : '<div class="ap-item good">无警告</div>';

  let trendHtml = a.trends.length
    ? a.trends.map(function(t){ return '<div class="ap-item trend">' + t + '</div>'; }).join('')
    : '<div class="ap-item">数据仅 1 天，趋势待累积</div>';

  let incHtml = a.incParts.length
    ? '<div class="inc-parts"><b>激励构成（可校验口径）</b><br>' + a.incParts.join('<br>') + '</div>'
    : '';

  let sugHtml = a.suggestions.length
    ? '<div class="ap-suggest ' + sugBg + '">' + a.suggestions.map(function(s){ return '• ' + s; }).join('<br>') + '</div>'
    : '';

  el.innerHTML =
    '<div class="ap-header"><span class="ap-status ' + sc + '">' + a.status + '</span>' +
    '<span class="ap-title">' + currentCity + ' · 诊断分析</span>' +
    '<span style="font-size:11px;color:#999;margin-left:auto">数据日期 ' + D.updateDate + '</span></div>' +
    '<div class="ap-grid">' +
      '<div><div class="ap-section-title">板块弱项（按可提升综合分排序）</div>' + weakHtml + '</div>' +
      '<div><div class="ap-section-title">关键完成率落后项</div>' + behindHtml +
        '<div class="ap-section-title" style="margin-top:10px">警告 / 红线</div>' + warnHtml +
        '<div class="ap-section-title" style="margin-top:10px">环比趋势</div>' + trendHtml + '</div>' +
    '</div>' + incHtml + sugHtml;
}

renderStatsCards();
renderCitySummaryTable();
renderAllCities();
</script>
</body>
</html>
