function wDisp(w) { return w <= 1.5 ? Math.round(w * 100) : Math.round(w); }
function fmtWan(v) { if (v == null || isNaN(v)) return '--'; const w = v / 10000; return (v >= 0 ? '+' : '') + w.toFixed(2) + '万'; }
function fmtWanN(v) { return (!v) ? '0.00万' : fmtWan(v); }
function fmtWanAbs(v) { if (v == null || isNaN(v)) return '--'; return (v / 10000).toFixed(2) + '万'; }
function snapItem(label, value, cls) {
  return '<div class="sim-snap-item"><div class="ss-label">' + label + '</div><div class="ss-value ' + (cls || '') + '">' + value + '</div></div>';
}
function snapItemSub(label, value, cls, sub) {
  return '<div class="sim-snap-item"><div class="ss-label">' + label + '</div><div class="ss-value ' + (cls || '') + '">' + value + '</div>' +
         (sub ? '<div class="ss-sub">' + sub + '</div>' : '') + '</div>';
}
function reasonRow(name, val, why) {
  return '<div class="reason-row"><span class="rs-name">' + name + '</span><span class="rs-val">' + val + '</span><span class="rs-why">' + why + '</span></div>';
}

function switchSimTab(t) { simTab = t; renderSimPanel(); }

function renderSimPanel() {
  const sim = SIM[currentCity];

  if (!sim) { el.innerHTML = '<div style="padding:12px;color:#999">该城市无测算数据</div>'; return; }
  const tabBtns = '<div style="display:flex;gap:8px;margin-bottom:12px">' +
    [['biz', '业务结果测算'], ['cater', '餐饮过程测算'], ['retail', '零售过程测算']].map(function(x) {
      return '<button class="page-tab' + (simTab === x[0] ? ' active' : '') + '" onclick="switchSimTab(\'' + x[0] + '\')">' + x[1] + '</button>';
    }).join('') + '</div>';
  if (simTab === 'biz') {
    el.innerHTML = tabBtns + renderBizSim(sim);
    calcSim();
  } else {
    const p = simTab === 'cater' ? sim.procCater : sim.procRetail;
    el.innerHTML = tabBtns + renderProcSim(sim, p, simTab === 'cater' ? '餐饮过程' : '零售过程');
    calcProcSim();
  }
}

function onSimChange() {
  const sim = SIM[currentCity]; if (!sim) return;
  sim.items.forEach(function(it) {
    const s = document.getElementById('slider_' + it.key), i = document.getElementById('input_' + it.key);
    if (s && i) i.value = s.value;
  });
  calcSim();
}
function onSimInput(key) {
  const sim = SIM[currentCity]; if (!sim) return;
  const it = sim.items.filter(function(x) { return x.key === key; })[0];
  const i = document.getElementById('input_' + key), s = document.getElementById('slider_' + key);
  if (i && s && it) s.value = Math.min(it.max, Math.max(0, parseFloat(i.value) || 0));
  calcSim();
}

    snapItemSub('当前' + bn + '正激励金额', p.posAmt > 0 ? fmtWan(p.posAmt) : '0（无）', p.posAmt > 0 ? 'pos' : '',
      '口径：' + bn + '激励 · 正激励金额') +
    snapItemSub('当前' + bn + '影响金额', p.curImpact === 0 ? '0.00万' : fmtWan(p.curImpact), p.curImpact < 0 ? 'neg' : '',
      '= ' + bn + '正激励 × (执行系数 − 1)') +
    '</div>';

  let form = '<div class="sim-form"><div class="sim-group">' +
    '<div class="sim-group-title">' + label + '子项得分 · 权重为该城实际考核权重（权重 0 的项已剔除；拖动滑杆模拟）</div>';
  p.items.forEach(function(it) {
    form += '<div class="sim-row"><label>' + it.name + '</label>' +
      '<span class="sim-current">当前 ' + it.val.toFixed(1) + ' · 权重 ' + wDisp(it.wt) + '%</span>' +
      '<input type="range" min="0" max="' + it.max + '" step="0.5" value="' + it.val + '" class="sim-slider" id="slider_' + it.key + '" oninput="onProcChange()">' +
      '<input type="number" min="0" max="' + it.max + '" step="0.1" value="' + it.val + '" id="input_' + it.key + '" oninput="onProcInput(\'' + it.key + '\')"></div>';
  });
  form += '</div></div>';

  let ctx = '<div class="sim-form" style="margin-top:14px"><div class="sim-group">' +
    '<div class="sim-group-title">' + label + '警告 · 自动预估（模拟过程得分 → 估算排名 → 警告 → 执行系数 → 金额）</div>' +
    '<div class="reason-table">' +
    reasonRow('警告规则', '排名 > ' + p.threshold + '% → 1 次警告', '10/1-10/8 全样本验证：餐饮 90.5%/92.9%/95.2% 警告、88.1% 无；零售 97.3%/100% 警告、83.3% 无') +
    reasonRow('执行系数规则', '无警告 1.00 ／ 有警告 ' + p.penalty.toFixed(2), '10月实测：警告数 0 → 系数 1.0，警告数 1 → 系数 0.8（百余行样本无一例外）') +
    reasonRow('金额影响规则', label + '影响 = ' + label + '正激励金额 × (系数−1)', '常山/江山/上虞实测：系数 0.8 但正激励为 0 → 影响金额 0；负激励不受过程系数影响') +
    '</div></div>' +
    '<div class="sim-group"><div class="sim-group-title">说明</div>' +
    '<div class="sim-note">过程得分 = Σ(子项得分×权重)/Σ权重（与表内' + label + '总分分毫吻合）；' +
    '排名按「得分每 +1 分 ≈ 前移 SENS 个百分点」线性估算；过程得分不直接决定激励点位，只通过 警告 → 执行系数 影响<b>正激励</b>金额；' +
    '警告累计 3 次 = 1 次严重警告；「是否警告豁免」城市（如新城区）以豁免后口径为准。</div>' +
    '<div style="margin-top:8px;font-size:12px;color:#666">排名灵敏度 SENS：<input type="number" id="simSens" value="1.5" step="0.1" min="0" style="width:56px;padding:3px 6px;border:1px solid #d0d5dd;border-radius:4px;text-align:center"> 个百分点/分</div>' +
    '</div></div>';

  let result = '<div class="sim-result"><div style="font-size:12px;font-weight:600;color:#555;margin-bottom:10px">测算结果</div>' +
    '<div class="sim-result-grid">' +
    '<div class="sim-result-item"><div class="sr-label">' + label + '得分</div><div class="sr-value" id="prScore">--</div><div class="sr-delta" id="prScoreDelta"></div></div>' +
    '<div class="sim-result-item"><div class="sr-label">估算组内排名</div><div class="sr-value" id="prRank">--</div><div class="sr-sub" id="prThreshold">阈值：> ' + p.threshold + '% → 警告</div></div>' +
    '<div class="sim-result-item"><div class="sr-label">警告判定</div><div class="sr-value" id="prWarn" style="font-size:16px">--</div><div class="sr-sub" id="prWarnSub"></div></div>' +
    '<div class="sim-result-item"><div class="sr-label">执行系数</div><div class="sr-value" id="prCoeff" style="font-size:16px">--</div></div>' +
    '<div class="sim-result-item"><div class="sr-label">预估' + bn + '影响金额</div><div class="sr-value" id="prImpact">--</div><div class="sr-delta" id="prImpactDelta"></div></div>' +
    '</div><div class="sim-breakdown" id="prBreakdown"></div><div class="sim-verdict" id="prVerdict"></div></div>';

  return snap + form + ctx + result;
}

function onProcChange() {
  const p = curProc(); if (!p) return;
  p.items.forEach(function(it) {
    const s = document.getElementById('slider_' + it.key), i = document.getElementById('input_' + it.key);
    if (s && i) i.value = s.value;
  });
  calcProcSim();
}
function onProcInput(key) {
  const p = curProc(); if (!p) return;
  const it = p.items.filter(function(x) { return x.key === key; })[0];
  const i = document.getElementById('input_' + key), s = document.getElementById('slider_' + key);
  if (i && s && it) s.value = Math.min(it.max, Math.max(0, parseFloat(i.value) || 0));
  calcProcSim();
}

function calcProcSim() {
  const p = curProc(); if (!p || !p.items) return;
  const label = simTab === 'cater' ? '餐饮过程' : '零售过程';
  const gv = function(k) { const e = document.getElementById('input_' + k); return e ? (parseFloat(e.value) || 0) : 0; };
  let num = 0, W = 0;
  p.items.forEach(function(it) {
    const v = Math.min(it.max, Math.max(0, gv(it.key)));
    num += v * it.wt; W += it.wt;
  });
  const score = W > 0 ? num / W : 0;
  const dScore = score - p.curScore;

  const sens = parseFloat((document.getElementById('simSens') || {}).value) || 1.5;
  const pct = Math.max(0, Math.min(100, p.curRank - sens * dScore));
  const warn = pct > p.threshold ? 1 : 0;
  const coeff = warn ? p.penalty : 1.0;
  const impact = (warn && p.posAmt > 0) ? p.posAmt * (coeff - 1) : 0;

  const set = function(id, txt) { const e = document.getElementById(id); if (e) e.textContent = txt; };
  set('prScore', score.toFixed(2));
  set('prRank', pct.toFixed(1) + '%');
  set('prWarn', warn ? '1 次警告' : '无警告');
  const wEl = document.getElementById('prWarn');
  if (wEl) wEl.style.color = warn ? '#dc2626' : '#16a34a';
  set('prWarnSub', warn ? '正激励' + (p.posAmt > 0 ? '将被打折' : '为 0，金额暂不受影响') : '执行系数不打折');
  set('prCoeff', coeff.toFixed(2));
  const cEl = document.getElementById('prCoeff');
  if (cEl) cEl.style.color = coeff < 1 ? '#dc2626' : '#16a34a';
  set('prImpact', impact === 0 ? '0.00万' : fmtWan(impact));

  const dEl = document.getElementById('prScoreDelta');
  if (dEl) { dEl.textContent = (dScore >= 0 ? '+' : '') + dScore.toFixed(2); dEl.className = 'sr-delta ' + (dScore > 0.01 ? 'up' : dScore < -0.01 ? 'down' : ''); }
  const iEl = document.getElementById('prImpactDelta');
  const dImpact = impact - (p.curImpact || 0);
  if (iEl) { iEl.textContent = '较当前 ' + (dImpact === 0 ? '0.00万' : fmtWan(dImpact)); iEl.className = 'sr-delta ' + (dImpact > 1 ? 'up' : dImpact < -1 ? 'down' : ''); }

  const lines = [];
  lines.push('模拟后' + label + '得分 <b>' + score.toFixed(2) + '</b>（当前 ' + p.curScore.toFixed(2) + '，' + (dScore >= 0 ? '+' : '') + dScore.toFixed(2) + '）');
  lines.push('排名估算 <b>' + pct.toFixed(1) + '%</b>（当前 ' + p.curRank.toFixed(1) + '%，阈值 > ' + p.threshold + '%）');
  if (warn) {
    lines.push('触发 <b>1 次警告</b> → 过程执行系数 ' + p.penalty.toFixed(2));
    if (p.posAmt > 0) lines.push('金额影响（' + label + '）= ' + label + '正激励 ' + fmtWan(p.posAmt) + ' × (' + p.penalty.toFixed(2) + ' − 1) = <b>' + fmtWan(impact) + '</b>');
    else lines.push('当前' + label + '正激励金额为 0 → ' + label + '影响金额 0（警告仍会计入累计）');
  } else {
    lines.push('执行系数 1.00 → ' + label + '激励金额不受影响');
  }
  const brEl = document.getElementById('prBreakdown');
  if (brEl) brEl.innerHTML = lines.join('<br>');

  const vd = document.getElementById('prVerdict');
  if (vd) {
    let tag, txt;
    if (warn && p.posAmt > 0) {
      vd.className = 'sim-verdict neg';
      tag = '预计警告 · 正激励打折';
      txt = '排名估算 <b>' + pct.toFixed(1) + '%</b> 超过 ' + p.threshold + '% → 1 次警告 → 执行系数 ' + p.penalty.toFixed(2) +
            '，' + label + '正激励 ' + fmtWan(p.posAmt) + ' 将被打 <b>8 折</b>（' + label + '影响 <b>' + fmtWan(p.posAmt * (p.penalty - 1)) + '</b>）；负激励不受影响';
    } else if (warn) {
      vd.className = 'sim-verdict neg';
      tag = '预计警告';
      txt = '排名估算 <b>' + pct.toFixed(1) + '%</b> 超过 ' + p.threshold + '% → 1 次警告 → 执行系数 ' + p.penalty.toFixed(2) +
            '；当前' + label + '无正激励金额，暂无金额影响（警告累计 3 次 = 1 次严重警告）';
    } else {
      vd.className = 'sim-verdict pos';
      tag = '无警告';
      txt = '排名估算 <b>' + pct.toFixed(1) + '%</b>（阈值 > ' + p.threshold + '%），执行系数 1.00，' + label + '激励金额不受影响；' +
            '较当前得分 ' + (dScore >= 0 ? '+' : '') + dScore.toFixed(2) + ' 分';
    }
    vd.innerHTML = '<span class="vd-tag">' + tag + '</span>' + txt;
  }
}

function calcSim() {
  const sim = SIM[currentCity]; if (!sim) return;
  const gv = function(k) { const e = document.getElementById('input_' + k); return e ? (parseFloat(e.value) || 0) : 0; };
  let num = 0, W = 0;
  sim.items.forEach(function(it) {
    const v = Math.min(it.max, Math.max(0, gv(it.key)));
    num += v * it.wt; W += it.wt;
  });
  const simBiz = W > 0 ? num / W : 0;
  const dBiz = simBiz - sim.curBiz;

  const sens = parseFloat((document.getElementById('simSens') || {}).value) || 1.5;
  const pct = Math.max(0, Math.min(100, sim.curRank - sens * dBiz));
  const BANDS = BANDS_OF(sim);
  const band = BANDS.filter(function(b) { return pct < b.max; })[0] || BANDS[BANDS.length - 1] || { label: '--', cp: 0, rp: 0, cn: 0, rn: 0, src: '' };

  let cat = 0, ret = 0, lines = [];
  if (band.cp > 0) {
    const pc = sim.price < 1 ? sim.price : 1;
    cat = sim.baseCater * band.cp / 100 * pc * sim.execC;
    lines.push('餐饮 = 全月基数 ' + fmtWanAbs(sim.baseCater) + ' × 正点位 ' + band.cp + '%' +
      (pc < 1 ? ' × 价格力折扣 ' + pc : '') + (sim.execC < 1 ? ' × 过程执行系数 ' + sim.execC : '') + ' = ' + fmtWan(cat));
  } else if (band.cn > 0) {
    cat = -sim.baseCater * band.cn / 100 * (1 - (sim.exemptC || 0));
    lines.push('餐饮 = 全月基数 ' + fmtWanAbs(sim.baseCater) + ' × 罚点位 ' + band.cn + '%' +
      ((sim.exemptC || 0) > 0 ? ' × (1-豁免' + Math.round(sim.exemptC * 100) + '%)' : '') + ' = ' + fmtWan(cat));
  }
  if (band.rp > 0) {
    ret = sim.baseRetail * band.rp / 100 * sim.execR;
    lines.push('零售 = 全月基数 ' + fmtWanAbs(sim.baseRetail) + ' × 正点位 ' + band.rp + '%' +
      (sim.execR < 1 ? ' × 过程执行系数 ' + sim.execR : '') + ' = ' + fmtWan(ret));
  } else if (band.rn > 0) {
    ret = -sim.baseRetail * band.rn / 100 * (1 - (sim.exemptR || 0));
    lines.push('零售 = 全月基数 ' + fmtWanAbs(sim.baseRetail) + ' × 罚点位 ' + band.rn + '%' +
      ((sim.exemptR || 0) > 0 ? ' × (1-豁免' + Math.round(sim.exemptR * 100) + '%)' : '') + ' = ' + fmtWan(ret));
  }
  const total = cat + ret;

  const set = function(id, txt) { const e = document.getElementById(id); if (e) e.textContent = txt; };
  set('simBiz', simBiz.toFixed(2));
  set('simRank', pct.toFixed(1) + '%');
  set('simBandLbl', band.label + (band.src ? ' · ' + band.src : ''));
  set('simMoney', total === 0 ? '0.00万' : fmtWan(total));
  set('simCatPt', band.cp > 0 ? '+' + band.cp + '%' : band.cn > 0 ? '-' + band.cn + '%' : '0%');
  set('simRetPt', band.rp > 0 ? '+' + band.rp + '%' : band.rn > 0 ? '-' + band.rn + '%' : '0%');
  set('simCatAmt', cat ? fmtWan(cat) : '');
  set('simRetAmt', ret ? fmtWan(ret) : '');

  const dEl = document.getElementById('simBizDelta');
  if (dEl) { dEl.textContent = (dBiz >= 0 ? '+' : '') + dBiz.toFixed(2); dEl.className = 'sr-delta ' + (dBiz > 0.01 ? 'up' : dBiz < -0.01 ? 'down' : ''); }
  const mEl = document.getElementById('simMoneyDelta');
  const dMoney = total - sim.curInc;
  if (mEl) { mEl.textContent = '较当前 ' + (dMoney === 0 ? '0.00万' : fmtWan(dMoney)); mEl.className = 'sr-delta ' + (dMoney > 1 ? 'up' : dMoney < -1 ? 'down' : ''); }

  const brEl = document.getElementById('simBreakdown');
  if (brEl) brEl.innerHTML = lines.length ? lines.join('<br>') : '当前档位无正/负激励点位，餐饮与零售金额均为 0。';

  const vd = document.getElementById('simVerdict');
  if (vd) {
    if (total > 0) vd.className = 'sim-verdict pos';
    else if (total < 0) vd.className = 'sim-verdict neg';
    else vd.className = 'sim-verdict';
    let tag, txt;
    if (total > 0) { tag = '预计参激励'; txt = '排名落在 <b>' + band.label + '</b>，按当前基数预估全月最终激励 <b>' + fmtWan(total) + '</b>'; }
    else if (total < 0) { tag = '预计负激励'; txt = '排名落在 <b>' + band.label + '</b>，按当前基数预估全月最终激励 <b>' + fmtWan(total) + '</b>；把得分抬回中部档即可归零'; }
    else { tag = '零激励'; txt = '排名估算落在 <b>' + band.label + '</b>：' + (band.src || '该区间无正/负激励点位。'); }
    vd.innerHTML = '<span class="vd-tag">' + tag + '</span>' + txt;
  }
}

    const d = formatted[city];
    if (!d) return;
    html += '<tr><td style="position:sticky;left:0;background:#fff;font-weight:700;z-index:1">' + city + '</td>';
    tab.cols.forEach(function(c) {
      const it = d[c.key];
      if (!it) { html += '<td>--</td>'; return; }
      const fw = (it.bolds && it.bolds[LI]) ? 'font-weight:800' : 'font-weight:600';
      html += '<td style="background:' + it.colors[LI] + ';' + fw + ';white-space:nowrap" title="' + c.label + '">' + it.values[LI] + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  wrap.innerHTML = html;
}

// ── 三级结构趋势表：一级=考核板块 › 二级=考核大项 › 三级=考核子项 ──
function trendCell(city, key, i, title) {
  const it = formatted[city][key];
  if (!it) return '<td class="metric-cell">--</td>';
  const bg = it.colors[i] || '#fff';
  const fw = (it.bolds && it.bolds[i]) ? 'font-weight:800' : 'font-weight:600';
  return '<td class="metric-cell" style="background-color:' + bg + ';' + fw + '" title="' + (title || '') + '">' + it.values[i] + '</td>';
}

function buildTrendTable(city) {
  const d = formatted[city];
  if (!d) return '<div style="padding:12px;color:#999">无数据</div>';
  const LI = dateLabels.length - 1;
  let html = '<div class="flat-section"><table class="metric-table trend-tree"><thead><tr><th class="metric-name">指标</th>';
  dispIdx.forEach(function(i){ html += '<th>' + dateLabels[i] + '</th>'; });
  html += '</tr></thead><tbody>';
  TREE.forEach(function(t, ti) {
    const isCol = !!collapsed[city + '|' + ti];
    html += '<tr class="tt-l1" onclick="toggleTrend(\'' + city + '\',' + ti + ')">' +
            '<td class="metric-name" style="border-left:6px solid ' + (GRP[t.grp]||'#4472C4') + '">' +
            '<span class="tt-caret">' + (isCol ? '▸' : '▾') + '</span>' + t.name + '</td>';
    dispIdx.forEach(function(i){ html += trendCell(city, t.score, i, t.name); });
    html += '</tr>';
    if (isCol) return;
    // 一级单项日维度行：排名 / 激励金额 / 警告（紧跟板块得分行）
    (t.flats || []).forEach(function(f) {
      html += '<tr class="tt-l1 tt-flat">' +
              '<td class="metric-name" style="border-left:6px solid ' + (GRP[t.grp]||'#4472C4') + '">' +
              '<span class="tt-caret sp"></span>' + f.name + '</td>';
      dispIdx.forEach(function(i){ html += trendCell(city, f.score, i, f.name); });
      html += '</tr>';
    });
    t.groups.forEach(function(g) {
      const wt = (g.weight && d[g.weight]) ? ' · 权重 ' + d[g.weight].values[LI] : '';
      html += '<tr class="tt-l2"><td class="metric-name"><span class="tt-caret sp"></span>' + g.name +
              '<span class="tt-meta">' + wt + '</span></td>';
      dispIdx.forEach(function(i){ html += g.score ? trendCell(city, g.score, i, g.name) : '<td></td>'; });
      html += '</tr>';
      g.rows.forEach(function(r) {
        html += '<tr class="tt-l3"><td class="metric-name" title="' + (r.path || r.label) + '">' + r.label + '</td>';
        dispIdx.forEach(function(i){ html += trendCell(city, r.key, i, r.label); });
        html += '</tr>';
      });
    });
  });
  html += '</tbody></table></div>';
  return html;
}

function toggleTrend(city, ti) {
  const k = city + '|' + ti;
  collapsed[k] = !collapsed[k];
  const t = document.getElementById('allCitiesTrend');
  if (t) t.innerHTML = buildAllCities();
  const m = document.getElementById('metricTree');
  if (m) m.innerHTML = buildTrendTable(currentCity);
}

function expandAllTrend(col) {
  cities.forEach(function(city) {
    TREE.forEach(function(t, ti) { collapsed[city + '|' + ti] = col; });
  });
  const t = document.getElementById('allCitiesTrend');
  if (t) t.innerHTML = buildAllCities();
  const m = document.getElementById('metricTree');
  if (m) m.innerHTML = buildTrendTable(currentCity);
}

function buildAllCities() {
  let html = '';
  cities.forEach(function(city) {
    const a = analysis[city] || {status:'零激励', inc:0};
    const sc = statusColor(a.status);
    html += '<div class="city-trend-block">';
    html += '<div class="city-trend-header" style="background:' + sc + '">' +
            '<span>' + city + ' <span style="font-weight:400;opacity:.85;font-size:12px">' +
            a.status + ' · 激励 ' + ((a.inc>=0?'+':'') + (a.inc||0).toLocaleString()) + '元</span>' +
            (a.warns && a.warns.length ? '<span class="cth-status" style="background:rgba(245,158,11,.9)">⚠ ' + a.warns.length + ' 项警告</span>' : '') +
            '</span><span style="font-size:12px;opacity:.85">日均基数 ' + ((a.base||0)/10000).toFixed(1) + '万</span></div>';
    html += '<div>' + buildTrendTable(city) + '</div>';
    html += '</div>';
  });
  return html;
}

function renderAllCities() {
  document.getElementById('allCitiesTrend').innerHTML = buildAllCities();
}

function renderCityDetail() {
  // 城市下拉
  const sel = document.getElementById('citySelect');
  if (sel.options.length !== cities.length) {
    sel.innerHTML = cities.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('');
    sel.value = currentCity;
  }
  document.getElementById('citySectionTitle').textContent = '· ' + currentCity + (cityMode === 's' ? ' 城市测算' : ' 各板块明细');
  renderAnalysis();
  document.getElementById('metricTree').innerHTML = buildTrendTable(currentCity);
  if (cityMode === 's') renderSimPanel();
}

function renderAnalysis() {
  const a = analysis[currentCity];
  const el = document.getElementById('analysisPanel');
  if (!a) { el.innerHTML = ''; return; }
  const sc = a.status === '正激励' ? 'pos' : a.status === '负激励' ? 'neg' : 'zero';

  let weakHtml = a.weak.length
    ? a.weak.map(function(w, i){ return '<div class="ap-item ' + (i===0?'highlight':'') + '">' + w.name + '：' + w.score + '分 · 权重' + w.weight + '% → 满权重可加综合 ' + w.potential + ' 分</div>'; }).join('')
    : '<div class="ap-item good">各板块得分均已 ≥100</div>';

  let behindHtml = a.behind.length
    ? a.behind.map(function(b){ return '<div class="ap-item trend">' + b.name + '：' + b.val + '%（<90%）</div>'; }).join('')
    : '<div class="ap-item good">关键完成率均 ≥90%</div>';

  let warnHtml = a.warns.length
    ? a.warns.map(function(w){ return '<div class="ap-item highlight">⚠️ ' + w + '</div>'; }).join('')
    : '<div class="ap-item good">无警告</div>';

  let trendHtml = a.trends.length
    ? a.trends.map(function(t){ return '<div class="ap-item trend">' + t + '</div>'; }).join('')
    : '<div class="ap-item">数据仅 1 天，趋势待累积</div>';

  let incHtml = a.incParts.length
    ? '<div class="inc-parts"><b>激励构成（可校验口径）</b><br>' + a.incParts.join('<br>') + '</div>'
    : '';

  el.innerHTML =
    '<div class="ap-header"><span class="ap-status ' + sc + '">' + a.status + '</span>' +
    '<span class="ap-title">' + currentCity + ' · 诊断分析</span>' +
    '<span style="font-size:11px;color:#999;margin-left:auto">数据日期 ' + D.updateDate + '</span></div>' +
    '<div class="ap-grid">' +
      '<div><div class="ap-section-title">板块弱项（按可提升综合分排序）</div>' + weakHtml + '</div>' +
      '<div><div class="ap-section-title">关键完成率落后项</div>' + behindHtml + '</div>' +
      '<div><div class="ap-section-title">警告 / 红线</div>' + warnHtml + '</div>' +
      '<div><div class="ap-section-title">环比趋势</div>' + trendHtml + '</div>' +
    '</div>' + incHtml;
}

renderStatsCards();
renderCitySummaryTable();
renderGroupTable();
renderAllCities();
</script>
